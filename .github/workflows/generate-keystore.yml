name: Generate Keystore (run once)

on:
  workflow_dispatch:
    inputs:
      key_password:
        description: 'Password for keystore (save this somewhere safe!)'
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Mask password in logs
        run: echo "::add-mask::${{ github.event.inputs.key_password }}"

      - name: Generate keystore
        run: |
          keytool -genkey -v \
            -keystore 21q-release.keystore \
            -alias 21q \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ github.event.inputs.key_password }}" \
            -keypass  "${{ github.event.inputs.key_password }}" \
            -dname "CN=21 Questions, OU=Simple AI, O=Simple AI, L=Unknown, S=Unknown, C=US"

      - name: Base64-encode keystore
        run: base64 -w 0 21q-release.keystore > 21q-release.keystore.b64

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            21q-release.keystore
            21q-release.keystore.b64
          retention-days: 1
